name: CI/CD Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-flutter-unit-widget:
    name: 🧪 Flutter Unit & Widget Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🔍 Flutter Analyze
        run: flutter analyze

      - name: 🧪 Run Flutter unit tests
        run: flutter test

  test-mcp-server:
    name: 🤖 MCP Server Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcp_server/package-lock.json

      - name: 📦 Install dependencies
        working-directory: mcp_server
        run: npm ci

      - name: 🧪 Run MCP Server tests
        working-directory: mcp_server
        run: npm run test

  test-firestore-rules:
    name: 🔥 Firestore Security Rules Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Firebase Tools CLI
        run: npm install -g firebase-tools

      - name: 📦 Install dependencies
        working-directory: test/firestore_rules_test
        run: npm ci

      - name: 🔥 Run Firestore Emulator and Rules Tests
        run: |
          npx firebase emulators:exec --only firestore "cd test/firestore_rules_test && npm run test" --project stanverysimplediary-dev

  build-android:
    name: 🏗️ Build Android (Dev)
    needs: [test-flutter-unit-widget]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🏗️ Build Android APK
        run: |
          flutter build apk --release \
            --dart-define=APP_ENV=dev \
            --dart-define=VERSION=1.0.0 \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define="DEPLOY_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-dev
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🔑 Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: 🚀 Deploy to Firebase App Distribution (Dev)
        run: |
          npx firebase-tools appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app 1:634048753631:android:c0762912de0bc0a7c6de6a \
            --groups "app-tester"

  build-and-deploy-web:
    name: 🌐 Build & Deploy Web (Dev)
    needs: [test-flutter-unit-widget, test-mcp-server, test-firestore-rules]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🌐 Build Flutter Web
        run: |
          flutter build web --release \
            --dart-define=APP_ENV=dev \
            --dart-define=VERSION=1.0.0 \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define="DEPLOY_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: 🔑 Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      - name: 🔥 Firebase Deploy (Dev)
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --project stanverysimplediary-dev

  integration-test-e2e:
    name: 🌐 Web E2E Integration Test
    needs: [build-and-deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🦅 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: ⚙️ Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: 🌐 Run Web Integration Test (Headless Chrome)
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_e2e_test.dart -d web-server

  post-deploy-smoke-test:
    name: 💨 Post-Deploy Smoke Test
    needs: [build-and-deploy-web]
    runs-on: ubuntu-latest
    steps:
      - name: 💨 Smoke Check Deployed App
        run: |
          curl -sSf https://stanverysimplediary-dev.web.app
